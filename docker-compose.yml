# Local dev with live reload of both halves (Vite on :3000, Flask on :5000).
# For the production-style single container, see the root Dockerfile and
# docs/DEPLOY_AZURE.md.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - FLASK_HOST=0.0.0.0
    volumes:
      - ./backend:/app
    command: python app.py
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped
